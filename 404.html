<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090f" />
    <meta name="robots" content="noindex" />
    <title>404 — Strona nie istnieje | Sylveon Company</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Przejdź do treści</a>
    <header class="topbar">
      <div class="container topbar__inner">
        <a href="/" class="brand" aria-label="Sylveon Company — strona główna">
          <img class="brand__logo" src="/logo.svg" width="28" height="28" alt="" />
          <span class="brand__a">Sylveon</span><span class="brand__b">Company</span>
        </a>
        <nav class="nav" aria-label="Główna nawigacja">
          <a href="/">Strona główna</a>
          <a href="mailto:kontakt@sylveoncompany.pl" class="nav__cta">Kontakt</a>
        </nav>
      </div>
    </header>

    <main id="main" class="error-page">
      <div class="container error-page__inner">
        <p class="eyebrow">404</p>
        <h1 class="hero__title">Nie ma takiej strony</h1>
        <p class="hero__lead">
          Link może być nieaktualny albo adres został wpisany z literówką.
        </p>
        <div class="hero__cta">
          <a class="btn btn--primary" href="/">Wróć na stronę główną <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <p>© <span id="year"></span> Sylveon Company · Piotr Grotkowski</p>
        <div class="footer__links">
          <a href="/polityka-prywatnosci">Polityka prywatności</a>
          <a href="https://dart.sylveoncompany.pl/" target="_blank" rel="noopener noreferrer"
            >Sylveon Dart Profile</a
          >
          <a href="mailto:kontakt@sylveoncompany.pl">kontakt@sylveoncompany.pl</a>
        </div>
      </div>
    </footer>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
